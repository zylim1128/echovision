# Define the root dataset directory
path: /mmfs1/gscratch/krishna/zylim/echovision/yolo11n/datasets

# Train/val/test paths (relative to 'path')
train: 
  - coco/train
  - crosswalk/train
  - training_images/train

val: 
  - coco/val
  - crosswalk/val
  - training_images/val

test:  # Optional
  - coco/test
  - crosswalk/test

# Number of classes
nc: 8 # 80 COCO classes + 1 new class (crosswalks)

# Class names (COCO classes + crosswalk)
names:
  0: person
  1: bicycle
  2: car
  3: bus
  4: traffic light
  5: stop sign
  6: chair
  7: crosswalks